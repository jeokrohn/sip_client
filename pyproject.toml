[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wxcalls"
version = "0.1.0"
description = "Python scenario-test framework prototype for Webex Calling generic SIP phones."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Internal" }]
dependencies = [
    "pjsua2",
    "pydantic>=2.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
wxcalls = "wxcalls.cli:main"

[project.entry-points.pytest11]
wxcalls = "wxcalls.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["wxcalls"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
strict = true
ignore_missing_imports = false
no_implicit_optional = false
warn_unused_configs = true

[tool.uv.sources]
pjsua2 = { path = "../../../../../../Documents/workspace/pjproject/pjsip-apps/src/swig/python/dist/pjsua2-2.17.dev0-cp313-cp313-macosx_11_0_arm64.whl" }

[dependency-groups]
dev = [
    "mypy>=2.1.0",
]
