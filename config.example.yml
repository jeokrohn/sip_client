artifacts_dir: artifacts
dns_nameservers: []
clients:
  - name: alice
    id_uri: "sip:alice@example.webexcalling.invalid"
    registrar_uri: "sip:example.webexcalling.invalid"
    proxy_uri: "sip:example.webexcalling.invalid;transport=tls"
    username_env: WX_SIP_ALICE_USER
    password_env: WX_SIP_ALICE_PASSWORD
    extension: "1001"
    transport: tls
    enable_video: true
  - name: bob
    id_uri: "sip:bob@example.webexcalling.invalid"
    registrar_uri: "sip:example.webexcalling.invalid"
    proxy_uri: "sip:example.webexcalling.invalid;transport=tls"
    username_env: WX_SIP_BOB_USER
    password_env: WX_SIP_BOB_PASSWORD
    extension: "1002"
    transport: tls
    enable_video: true
  # Registration-based Local Gateway example. Copy your own Control Hub values
  # into a local config and keep the password in the referenced environment variable.
  # - name: lgw1
  #   kind: local_gateway
  #   registrar_domain: "example.cisco-bcld.com"
  #   trunk_group: "example_trunk_group"
  #   line_port: "example_line_port"
  #   outbound_proxy: "example.sipconnect-us.bcld.webex.com"
  #   username_env: WX_LGW1_AUTH_USER
  #   password_env: WX_LGW1_AUTH_PASSWORD
  #   transport: tls
targets:
  - name: webex_user
    uri: "sip:someone@example.com"
    kind: webex
