name: leslie-answer-incoming
steps:
  - action: register
    client: Leslie
    timeout: 30
  - action: expect_incoming
    client: Leslie
    save_as: leslie_incoming
    timeout: 120
  - action: answer
    call: leslie_incoming
  - action: wait_media
    call: leslie_incoming
    timeout: 30
  - action: play_tts
    call: leslie_incoming
    text: "test call established. Pls. hang up"
  - action: wait_state
    call: leslie_incoming
    state: disconnected
    timeout: 120
