name: lgw-darmstadt-call-18725550103

# Each endpoint registers, then its behavior handles the call lifecycle.
behaviors:
  lgw_caller:
    initial_state: unregistered
    states:
      unregistered:
        entry:
          - action: register
        on:
          registered:
            next_state: idle

      idle:
        on:
          scenario_trigger:
            name: start_call
            next_state: calling

      calling:
        entry:
          - action: call
            # The runner derives the SIP URI from the LGW registrar settings.
            target: "+18725550103"
            # Uncomment and replace with the numeric calling line identity.
            caller_id: "+442074037970"
            # Optional PAI-only override; defaults to caller_id when provided.
            # pai_caller_id: "+442074037971"
            save_as: outbound
        on:
          call_state:
            call: outbound
            state: connected
            next_state: connected

      connected:
        entry:
          - action: start_timer
            name: hangup_delay
            seconds: 20
          - action: play_tts
            call: outbound
            text: "This is a media test. You should hear this message."
            marker: media-check
        on:
          timer_expired:
            timer: hangup_delay
            actions:
              - action: hangup
                call: outbound
          call_state:
            call: outbound
            state: disconnected
            next_state: done

      done:
        entry:
          - action: cancel_timer
            name: hangup_delay

  leslie_callee:
    initial_state: unregistered
    states:
      unregistered:
        entry:
          - action: register
        on:
          registered:
            next_state: idle

      idle:
        on:
          call_received:
            save_call_as: inbound
            next_state: ringing

      ringing:
        entry:
          - action: start_timer
            name: answer_delay
            seconds: 3
        on:
          timer_expired:
            timer: answer_delay
            actions:
              - action: answer
                call: inbound
            next_state: answering

      answering:
        on:
          call_state:
            call: inbound
            state: connected
            next_state: connected

      connected:
        on:
          call_state:
            call: inbound
            state: disconnected
            next_state: done
        entry:
          - action: play_tts
            call: inbound
            text: "This is a media test. You should hear this message. This is a media test. You should hear this message. This is a media test. You should hear this message"
            marker: media-check

      done:
        entry:
          - action: cancel_timer
            name: answer_delay

endpoints:
  lgw_darmstadt:
    client: lgw_darmstadt
    behavior: lgw_caller
  Leslie:
    client: Leslie
    behavior: leslie_callee

steps:
  - action: wait_behavior_state
    endpoint: lgw_darmstadt
    state: idle
    timeout: 30

  - action: wait_behavior_state
    endpoint: Leslie
    state: idle
    timeout: 30

  - action: trigger_behavior
    endpoint: lgw_darmstadt
    name: start_call

  - action: wait_behavior_state
    endpoint: lgw_darmstadt
    state: done
    timeout: 120

  - action: wait_behavior_state
    endpoint: Leslie
    state: done
    timeout: 120
