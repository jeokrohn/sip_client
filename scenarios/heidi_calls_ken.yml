name: basic-audio-marker
steps:
  - action: register
    clients: [Heidi, Ken]
  - action: call
    client: Heidi
    target: 7108
    save_as: heidi_to_ken
  - action: expect_incoming
    client: Ken
    save_as: ken_incoming
  - action: answer
    call: ken_incoming
  - action: wait_state
    call: heidi_to_ken
    state: connected
  - action: play_tts
    call: heidi_to_ken
    text: "Webex Calling test marker."
    marker: marker-basic-audio
  - action: record
    call: ken_incoming
    seconds: 1.0
    save_as: ken_recording
  - action: assert_marker
    recording: ken_recording
    marker: marker-basic-audio
  - action: hangup
    calls: [heidi_to_ken, ken_incoming]

